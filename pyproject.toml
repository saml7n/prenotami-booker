[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prenotami-booker"
version = "0.1.0"
description = "Automated appointment booking tool for Italian Consulate via Prenot@mi"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "selenium>=4.15.0",
    "structlog>=23.2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "ntplib>=0.4.0",
    "click>=8.1.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
]

[project.scripts]
prenotami = "prenotami_booker.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
